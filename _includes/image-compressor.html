<div x-data="imageCompressor">
  <label class="field-label" for="file-input">Upload image</label>

  <div class="dropzone" id="dropzone" :class="{ dragover: dragover }"
       @dragover.prevent="dragover = true"
       @dragleave.prevent="dragover = false"
       @drop.prevent="dragover = false; selectFile($event.dataTransfer.files[0])">
    <input type="file" id="file-input" accept="image/png,image/jpeg,image/webp"
           @change="selectFile($event.target.files[0])">
    <p class="dropzone-hint"><strong>Drag &amp; drop your image here</strong> or browse</p>
    <p class="dropzone-status" id="file-status" role="status" x-text="status">No file selected</p>
  </div>

  <div class="control-group">
    <label for="quality-range">Compression quality <span x-text="quality.toFixed(2)">0.70</span></label>
    <input type="range" id="quality-range" min="0.1" max="1.0" step="0.05" x-model.number="quality">
  </div>

  <button type="button" id="compress-btn" class="btn-primary" @click="compress" :disabled="busy">
    <span x-show="!busy">Compress image</span>
    <span x-show="busy">Compressing…</span>
  </button>
</div>
