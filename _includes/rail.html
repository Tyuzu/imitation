<nav class="category-rail" aria-label="Primary Categories">
  {% for item in site.rail_categories %}
    {% assign is_active = false %}
    {% if page.rail == item.id or page.url == item.url %}
      {% assign is_active = true %}
    {% endif %}
    <a href="{{ item.url | relative_url }}" class="rail-item {% if is_active %}active{% endif %}">
      <div class="rail-badge {% if item.is_brand %}brand-badge{% endif %}">
        {{ item.icon }}
      </div>
      <span class="rail-label">{{ item.label }}</span>
    </a>
  {% endfor %}
</nav>
