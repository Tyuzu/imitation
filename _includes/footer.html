<footer class="site-footer">
  <div class="workspace-container">
    {% if page.show_ads != false %}
      <div class="ad-slot ad-slot-footer">ADVERTISEMENT</div>
    {% endif %}

    <div class="footer-grid">
      {% for col in site.data.footer_directory %}
        <div class="footer-col">
          <h3 class="footer-heading">{{ col.heading }}</h3>
          <ul class="footer-list">
            {% for item in col.links %}
              <li><a href="{{ item.url | relative_url }}">{{ item.title }}</a></li>
            {% endfor %}
          </ul>
        </div>
      {% endfor %}
    </div>

    <div class="footer-bottom">
      <div>{{ site.copyright }}</div>
      <div class="footer-legal">
        <a href="{{ '/privacy-policy/' | relative_url }}">Privacy Policy</a>
        <a href="{{ '/terms-of-service/' | relative_url }}">Terms of Service</a>
      </div>
    </div>
  </div>
</footer>
