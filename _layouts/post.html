---
layout: default
---
<article class="discord-message">
  <img src="{{ site.author.avatar }}" alt="{{ site.author.name }}" class="msg-avatar">
  <div class="msg-body">
    <div class="msg-header">
      <span class="msg-author">{{ site.author.name }}</span>
      <span class="bot-badge">OP</span>
      <time class="msg-timestamp" datetime="{{ page.date | date_to_xmlschema }}">
        {{ page.date | date: "%m/%d/%Y %I:%M %p" }}
      </time>
    </div>

    <!-- Discord Rich Embed for Post Title & Summary -->
    <div class="discord-embed">
      <div class="embed-title">{{ page.title }}</div>
      {% if page.description %}
        <div class="embed-desc">{{ page.description }}</div>
      {% endif %}
    </div>

    <div class="msg-content markdown-body">
      {{ content }}
    </div>
  </div>
</article>
