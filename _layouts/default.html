<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta name="theme-color" content="#1155f5">
  <title>{% if page.title %}{{ page.title | escape }} — {% endif %}{{ site.title | escape }}</title>
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <script>
    document.documentElement.setAttribute('data-theme', localStorage.getItem('imigi-theme') || 'light');
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body x-data="siteShell()">
  <a class="skip-link" href="#main-content">Skip to content</a>
  <div class="app-shell">
    <!-- 1. Far-Left Category Rail -->
    {% include rail.html %}

    <!-- 2. Secondary Navigation Drawer -->
    {% include sidebar.html %}

    <!-- 3. Scrollable Main Workspace -->
    <div class="workspace">
      <header class="topbar">
        <div class="topbar-left">
          <button id="mobile-nav-btn" class="icon-btn mobile-only" type="button" aria-label="Open navigation" aria-controls="nav-drawer" aria-expanded="false" @click="toggleNav" :aria-expanded="navOpen" :aria-label="navOpen ? 'Close navigation' : 'Open navigation'">☰</button>
          <a href="{{ '/' | relative_url }}" class="topbar-brand" aria-label="{{ site.title }} home">
            <span class="brand-circle">{{ site.brand_letter }}</span>
            <span class="brand-name">{{ site.title }}</span>
          </a>
        </div>

        <div class="topbar-center">
          <div class="search-pill" @click.outside="searchOpen = false">
            <label class="visually-hidden" for="global-tool-search">Search tools</label>
            <svg class="search-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <circle cx="9" cy="9" r="6"></circle>
              <path d="M13.5 13.5L17 17" stroke-linecap="round"></path>
            </svg>
            <input type="text" id="global-tool-search" placeholder="Search tools, formats, categories..." autocomplete="off" x-model="searchQuery" @input="searchTools" @keydown.escape.prevent="clearSearch">
            <div id="search-results" class="search-dropdown" role="listbox" x-show="searchOpen" x-cloak>
              <template x-for="match in matches" :key="match.url">
                <a :href="match.url" class="search-result-item" role="option">
                  <span x-text="match.title"></span>
                  <span class="search-result-cat" x-text="match.category"></span>
                </a>
              </template>
              <div class="search-result-item" role="option" x-show="matches.length === 0"><span>No matching tools</span></div>
            </div>
          </div>
        </div>

        <div class="topbar-right">
          <button id="theme-toggle" class="pill-btn icon-only" type="button" :aria-label="dark ? 'Switch to light theme' : 'Switch to dark theme'" :aria-pressed="dark" title="Toggle theme" @click="toggleTheme">
            <span aria-hidden="true">☀/☾</span>
          </button>
        </div>
      </header>

      <main class="workspace-main" id="main-content">
        <div class="workspace-container">
          {% if page.show_ads != false %}
            <div class="ad-slot">SPONSORED</div>
          {% endif %}

          {{ content }}

          {% if page.show_ads != false %}
            <div class="ad-slot">SPONSORED</div>
          {% endif %}
        </div>
      </main>

      <!-- Multi-Column Directory Footer -->
      {% include footer.html %}
    </div>
  </div>

  <!-- Search Index JSON for Instant Filtering -->
  <script id="tool-index-data" type="application/json">
    [
      {% for section in site.data.footer_directory %}
        {% for link in section.links %}
          {
            "title": {{ link.title | jsonify }},
            "category": {{ section.heading | jsonify }},
            "url": {{ link.url | relative_url | jsonify }}
          }{% unless forloop.last and forloop.parentloop.last %},{% endunless %}
        {% endfor %}
      {% endfor %}
    ]
  </script>
  <script src="{{ '/assets/js/app.js' | relative_url }}"></script>
</body>
</html>
